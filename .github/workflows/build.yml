---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/misc/*'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/calamityfox"
  IMAGE_NAME: "meryyn"
  DEFAULT_TAG: "latest"
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Download and verify fedora-silverblue:latest
        run: |
          cat <<'EOF' > Containerfile
          FROM quay.io/fedora/fedora-silverblue:latest
          RUN bootc container lint
          EOF

      - name: Install RPMs
        run: |
          cat <<'EOF' >> Containerfile
          RUN <<-'EOT' sh
          installRPM=(
           age
           greetd
           niri
           noctalia
           noctalia-greeter
           tldr
           yt-dlp
           )
          dnf5 install -y --nogpgcheck --repofrompath 'terra,https://repos.fyralabs.com/terra$releasever' terra-release
          dnf5 install -y "${installRPM[@]}"
          EOT
          EOF

      - name: Remove RPMs
        run: |
          cat <<'EOF' >> Containerfile
          RUN <<-'EOT' sh
          removeRPM=(
           alacritty
           fuzzel
           gdm
           gnome-browser-connector
           gnome-classic-session
           gnome-initial-setup
           gnome-session-wayland-session
           gnome-shell
           gnome-shell-extension-apps-menu
           gnome-shell-extension-common
           gnome-shell-extension-background-logo
           gnome-shell-extension-launch-new-instance
           gnome-shell-extension-places-menu
           gnome-shell-extension-window-list
           swaylock
           waybar
           )
          rpm-ostree override remove "${removeRPM[@]}"
          EOT
          EOF

      - name: Install Flatpaks
        run: |
          cat <<'EOF' >> Containerfile
          RUN <<-'EOT' sh
          installFLATPAK=(
           app.devsuite.Ptyxis # Terminal
           app.drey.Warp # File sharing via `magic-wormhole`
           com.github.johnfactotum.Foliate # E-book reader
           com.github.tchx84.Flatseal # Flatpak permission manager
           de.haeckerfelix.Fragments # Torrent client
           io.github.kolunmi.Bazaar # App store
           io.gitlab.adhami3310.Impression # ISO flasher
           io.gitlab.librewolf-community # Browser
           org.gnome.Calculator # Calculator
           org.gnome.FileRoller # Archive utility
           org.gnome.Loupe # Image viewer
           org.gnome.Papers # Document viewer
           org.gnome.Showtime # Video player
           org.gnome.TextEditor # Text editor
           org.gnome.Weather # Weather
           org.gnome.World.Iotas # Notes
           org.gnome.World.PikaBackup # GUI for `borgbackup`
           org.gnome.World.Secrets # KeePass password manager
           org.libreoffice.LibreOffice # Office suite
           org.mozilla.thunderbird # E-mail client
           )
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub "${installFLATPAK[@]}"
          EOT
          EOF

      - name: Build Image
        run: |
          set -euox pipefail
          LABELS=()
          if [[ -z "$(git status -s)" ]]; then
            GIT_SHA=$(git rev-parse --short HEAD)
            LABELS+=("--label" "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/calamityfox/meryyn/${GIT_SHA}/README.md")
            LABELS+=("--label" "org.opencontainers.image.documentation=https://raw.githubusercontent.com/calamityfox/meryyn/${GIT_SHA}/README.md")
            LABELS+=("--label" "org.opencontainers.image.source=https://github.com/calamityfox/meryyn/blob/${GIT_SHA}/Containerfile")
            LABELS+=("--label" "org.opencontainers.image.url=https://github.com/calamityfox/meryyn/tree/${GIT_SHA}")
            LABELS+=("--label" "org.opencontainers.image.version=latest.$(date +%Y%m%d)-${GIT_SHA}")
          fi
          podman build "${LABELS[@]}" --pull=newer --tag meryyn:latest --file Containerfile .

      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          set -xeuo pipefail
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d ./meryyn_chunkah_XXXXXX)"
          trap 'rm -f "${CHUNKAH_CONFIG_FILE}"; rm -rf "${CHUNKAH_OUTPUT_DIR}"' EXIT
          podman inspect meryyn:latest > "${CHUNKAH_CONFIG_FILE}"

          podman run --rm \
            --mount=type=image,src=meryyn:latest,target=/chunkah \
            -v "${CHUNKAH_CONFIG_FILE}:/chunkah-config.json:ro,Z" \
            -v "${CHUNKAH_OUTPUT_DIR}:/run/out:Z" \
            quay.io/coreos/chunkah:latest \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman tag "${CHUNKED_IMAGE}" meryyn:latest

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euox pipefail
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          if [[ -z "$(git status -s)" ]]; then
            GIT_SHA=$(git rev-parse --short HEAD)
            BUILD_TAGS+=("latest-${GIT_SHA}")
            BUILD_TAGS+=("latest-${DATE}-${GIT_SHA}")
            BUILD_TAGS+=("${DATE}-${GIT_SHA}")
          fi
          BUILD_TAGS+=("${DATE}")
          BUILD_TAGS+=("latest")
          BUILD_TAGS+=("latest-${DATE}")
          echo "Tags for this Action..."
          echo "${BUILD_TAGS[@]}"
          echo "alias_tags=${BUILD_TAGS[@]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          IMAGE=$(podman inspect meryyn:latest | jq -r .[].Id)
          podman untag "${IMAGE}"
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE}" "meryyn:${tag}"
          done
          podman images- name: Build Image
        run: |
          set -euox pipefail
          LABELS=()
          if [[ -z "$(git status -s)" ]]; then
            GIT_SHA=$(git rev-parse --short HEAD)
            LABELS+=("--label" "io.artifacthub.package.readme-url=https://raw.githubusercontent.com/calamityfox/meryyn/${GIT_SHA}/README.md")
            LABELS+=("--label" "org.opencontainers.image.documentation=https://raw.githubusercontent.com/calamityfox/meryyn/${GIT_SHA}/README.md")
            LABELS+=("--label" "org.opencontainers.image.source=https://github.com/calamityfox/meryyn/blob/${GIT_SHA}/Containerfile")
            LABELS+=("--label" "org.opencontainers.image.url=https://github.com/calamityfox/meryyn/tree/${GIT_SHA}")
            LABELS+=("--label" "org.opencontainers.image.version=latest.$(date +%Y%m%d)-${GIT_SHA}")
          fi
          podman build "${LABELS[@]}" --pull=newer --tag meryyn:latest --file Containerfile .

      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          set -xeuo pipefail
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d ./meryyn_chunkah_XXXXXX)"
          trap 'rm -f "${CHUNKAH_CONFIG_FILE}"; rm -rf "${CHUNKAH_OUTPUT_DIR}"' EXIT
          podman inspect meryyn:latest > "${CHUNKAH_CONFIG_FILE}"

          podman run --rm \
            --mount=type=image,src=meryyn:latest,target=/chunkah \
            -v "${CHUNKAH_CONFIG_FILE}:/chunkah-config.json:ro,Z" \
            -v "${CHUNKAH_OUTPUT_DIR}:/run/out:Z" \
            quay.io/coreos/chunkah:latest \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman tag "${CHUNKED_IMAGE}" meryyn:latest

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          set -euox pipefail
          DATE=$(date +%Y%m%d)
          BUILD_TAGS=()
          if [[ -z "$(git status -s)" ]]; then
            GIT_SHA=$(git rev-parse --short HEAD)
            BUILD_TAGS+=("latest-${GIT_SHA}")
            BUILD_TAGS+=("latest-${DATE}-${GIT_SHA}")
            BUILD_TAGS+=("${DATE}-${GIT_SHA}")
          fi
          BUILD_TAGS+=("${DATE}")
          BUILD_TAGS+=("latest")
          BUILD_TAGS+=("latest-${DATE}")
          echo "Tags for this Action..."
          echo "${BUILD_TAGS[@]}"
          echo "alias_tags=${BUILD_TAGS[@]}" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          IMAGE=$(podman inspect meryyn:latest | jq -r .[].Id)
          podman untag "${IMAGE}"
          for tag in ${ALIAS_TAGS}; do
            podman tag "${IMAGE}" "meryyn:${tag}"
          done
          podman images

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ghcr.io/calamityfox/meryyn@${DIGEST}
