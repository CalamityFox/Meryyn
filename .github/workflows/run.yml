---
name: Container Workflow
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '15 11 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '**/misc/*'
  workflow_dispatch:

  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and Push meryyn:latest to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by RenovateBot
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Prepare Container
        run: |
          cat <<'EOF' >> meryyn-config
          FROM quay.io/fedora/fedora-silverblue:latest
          RUN <<-'EOT' sh
          
          installRPM=(
           @cinnamon-desktop-environment
           )
          dnf5 install -y --setopt=install_weak_deps=False "${installRPM[@]}"

          removeRPM=(
           eom
           gucharmap
           mintlocale
           mpv
           pidgin
           simple-scan
           shotwell
           thunderbird
           transmission-gtk
           xawtv
           xed
           xfburn
           xreader
           zoitechat
           )
          rpm-ostree override remove "${removeRPM[@]}"

          mkdir -p /usr/share/icons/
          curl "https://github.com/CalamityFox/Meryyn/tree/main/system files/Neuwaita" \ 
          > /usr/share/icons
          
          ls /usr/share/icons


          bootc container lint
          EOT
          EOF

      - name: Build Container
        run: |
          set -euox pipefail
          podman build \
          --pull=newer \
          --tag "meryyn:latest" \
          --file meryyn-config .

      - name: Rechunk w. Chunkah
        id: rechunk
        run: |
          set -xeuo pipefail

          # pin chunkah image to hash once mature enough
          CHUNKAH_CONFIG_FILE="$(mktemp)"

          CHUNKAH_OUTPUT_DIR="$(mktemp -d ./"meryyn"_chunkah_XXXXXX)"

          trap 'rm -f "${CHUNKAH_CONFIG_FILE}"; rm -rf "${CHUNKAH_OUTPUT_DIR}"' EXIT
          podman inspect "meryyn:latest" > "${CHUNKAH_CONFIG_FILE}"

          podman run --rm \
            --mount=type=image,src="meryyn:latest",target=/chunkah \
            -v "${CHUNKAH_CONFIG_FILE}:/chunkah-config.json:ro,Z" \
            -v "${CHUNKAH_OUTPUT_DIR}:/run/out:Z" \
            quay.io/coreos/chunkah:latest \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman tag "${CHUNKED_IMAGE}" "meryyn:latest"

      - name: Tag Image
        run: |
         set -eoux pipefail
         DATE=$(date +%Y%m%d)

         podman tag meryyn:latest "meryyn:${DATE}"
         podman tag meryyn:latest "meryyn:latest"
         podman tag meryyn:latest "meryyn:latest-${DATE}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        run: |
          set -euox pipefail
          DATE=$(date +%Y%m%d)

          podman push --digestfile=/tmp/digestfile meryyn:$DATE ghcr.io/calamityfox/meryyn:$DATE
          podman push --digestfile=/tmp/digestfile meryyn:latest ghcr.io/calamityfox/meryyn:latest
          podman push --digestfile=/tmp/digestfile meryyn:latest-$DATE ghcr.io/calamityfox/meryyn:latest-$DATE

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ghcr.io/calamityfox/meryyn@${DIGEST}
